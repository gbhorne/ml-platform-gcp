  <text x="540" y="218" text-anchor="middle" fill="#e8edf8" font-size="12" font-weight="bold" font-family="Georgia, serif">features_timeseries + features_monthly</text>
  <text x="540" y="236" text-anchor="middle" fill="#3a8050" font-size="9" font-family="'Courier New', monospace">15+ features: moving averages · lag features · seasonality · holiday flags · rolling stats</text>

