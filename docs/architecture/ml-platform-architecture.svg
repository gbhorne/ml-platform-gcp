  <text x="520" y="52" text-anchor="middle" fill="#2a3a55" font-size="9" font-family="'Courier New', monospace" letter-spacing="3">GCP — BIGQUERY ML — RETAIL FORECASTING — 90-DAY HORIZON</text>
  <line x1="60" y1="62" x2="980" y2="62" stroke="#1a2438" stroke-width="1"/>

  <!-- ── ROW 1: INGESTION ── -->

  <!-- CSV Files -->
  <rect x="60" y="76" width="140" height="64" rx="8" fill="url(#gGray)" stroke="#2a3a50" stroke-width="1.5"/>
  <text x="130" y="98" text-anchor="middle" fill="#5a7090" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">SOURCE</text>
  <text x="130" y="116" text-anchor="middle" fill="#e8edf8" font-size="12" font-weight="bold" font-family="Georgia, serif">CSV Files</text>
  <text x="130" y="132" text-anchor="middle" fill="#3a5070" font-size="9" font-family="'Courier New', monospace">3 categories</text>

  <!-- Arrow -->
  <line x1="202" y1="108" x2="238" y2="108" stroke="#3a6aaa" stroke-width="1.5" marker-end="url(#arrowB)"/>

