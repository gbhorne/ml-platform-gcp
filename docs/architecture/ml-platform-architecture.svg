  <line x1="220" y1="376" x2="340" y2="418" stroke="#7050b0" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="520" y1="376" x2="520" y2="418" stroke="#7050b0" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="820" y1="376" x2="700" y2="418" stroke="#7050b0" stroke-width="1.5" marker-end="url(#arrowP)"/>

  <!-- ── ROW 4: PREDICTIONS + MANAGEMENT ── -->
  <!-- Predictions -->
  <rect x="200" y="422" width="440" height="72" rx="8" fill="url(#gOrange)" stroke="#a06828" stroke-width="1.5"/>
  <rect x="200" y="422" width="440" height="4" rx="2" fill="#a06828"/>
  <text x="420" y="444" text-anchor="middle" fill="#d4964e" font-size="9" letter-spacing="2" font-family="'Courier New', monospace">PREDICTIONS OUTPUT</text>
  <text x="420" y="462" text-anchor="middle" fill="#e8edf8" font-size="12" font-weight="bold" font-family="Georgia, serif">270 predictions · 90-day horizon · 95% CI</text>
  <text x="420" y="480" text-anchor="middle" fill="#a06828" font-size="9" font-family="'Courier New', monospace">all_predictions · predictions_electronics/apparel/home_garden · sales_forecast_view</text>

  <!-- Model Registry -->
  <rect x="660" y="422" width="200" height="72" rx="8" fill="url(#gTeal)" stroke="#2a7080" stroke-width="1.5"/>
  <text x="760" y="444" text-anchor="middle" fill="#40a0b0" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">MODEL MANAGEMENT</text>
  <text x="760" y="462" text-anchor="middle" fill="#e8edf8" font-size="12" font-weight="bold" font-family="Georgia, serif">Model Registry</text>
  <text x="760" y="480" text-anchor="middle" fill="#2a7080" font-size="9" font-family="'Courier New', monospace">3 models · v1.0 · data lineage</text>

  <!-- Arrow predictions to Looker -->
  <line x1="420" y1="496" x2="420" y2="522" stroke="#c07830" stroke-width="1.5" marker-end="url(#arrowO)"/>

