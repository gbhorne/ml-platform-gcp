  <rect x="240" y="76" width="160" height="4" rx="2" fill="#2a4a70"/>
  <text x="320" y="98" text-anchor="middle" fill="#4a80c0" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">STORAGE</text>
  <text x="320" y="116" text-anchor="middle" fill="#e8edf8" font-size="12" font-weight="bold" font-family="Georgia, serif">Cloud Storage</text>
  <text x="320" y="132" text-anchor="middle" fill="#3a6090" font-size="9" font-family="'Courier New', monospace">raw/ folder · 3 CSVs</text>

  <!-- Arrow -->
  <line x1="402" y1="108" x2="438" y2="108" stroke="#3a6aaa" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- BigQuery Raw -->
  <rect x="440" y="76" width="200" height="64" rx="8" fill="url(#gBlue)" stroke="#3a6aaa" stroke-width="2"/>
  <rect x="440" y="76" width="200" height="4" rx="2" fill="#3a6aaa"/>
  <text x="540" y="98" text-anchor="middle" fill="#5a9ad4" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">DATA WAREHOUSE</text>
  <text x="540" y="116" text-anchor="middle" fill="#e8edf8" font-size="12" font-weight="bold" font-family="Georgia, serif">BigQuery — retail_ml</text>
  <text x="540" y="132" text-anchor="middle" fill="#3a6090" font-size="9" font-family="'Courier New', monospace">3 raw tables · 3,285 rows · 99.7% quality</text>

