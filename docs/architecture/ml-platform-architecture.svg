  <line x1="370" y1="250" x2="220" y2="282" stroke="#3a8050" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowG)"/>
  <line x1="540" y1="250" x2="520" y2="282" stroke="#3a8050" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowG)"/>
  <line x1="710" y1="250" x2="820" y2="282" stroke="#3a8050" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowG)"/>

