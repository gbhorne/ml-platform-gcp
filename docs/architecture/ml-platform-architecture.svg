  <text x="520" y="306" text-anchor="middle" fill="#9070d0" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">ARIMA PLUS MODEL</text>
  <text x="520" y="324" text-anchor="middle" fill="#e8edf8" font-size="12" font-weight="bold" font-family="Georgia, serif">apparel_forecast</text>
  <text x="520" y="342" text-anchor="middle" fill="#7050b0" font-size="9" font-family="'Courier New', monospace">ARIMA(0,1,2) · AIC 9,486</text>
  <text x="520" y="358" text-anchor="middle" fill="#7050b0" font-size="9" font-family="'Courier New', monospace">~14 min training</text>

