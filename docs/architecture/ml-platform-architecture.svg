  <!-- Electronics -->
  <rect x="100" y="284" width="240" height="90" rx="8" fill="url(#gPurple)" stroke="#5040a0" stroke-width="1.5"/>
  <rect x="100" y="284" width="240" height="4" rx="2" fill="#5040a0"/>
  <text x="220" y="306" text-anchor="middle" fill="#9070d0" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">ARIMA PLUS MODEL</text>
  <text x="220" y="324" text-anchor="middle" fill="#e8edf8" font-size="12" font-weight="bold" font-family="Georgia, serif">electronics_forecast</text>
  <text x="220" y="342" text-anchor="middle" fill="#7050b0" font-size="9" font-family="'Courier New', monospace">ARIMA(0,1,2) · AIC 9,221</text>
  <text x="220" y="358" text-anchor="middle" fill="#7050b0" font-size="9" font-family="'Courier New', monospace">~12 min training</text>

