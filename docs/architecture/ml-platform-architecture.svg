  <rect x="100" y="526" width="640" height="22" rx="6" fill="#1a1006" stroke="#c07830" stroke-width="1.5"/>
  <text x="420" y="541" text-anchor="middle" fill="#d4964e" font-size="9" letter-spacing="2" font-family="'Courier New', monospace">LOOKER STUDIO — Interactive Dashboard — Time Series + Confidence Intervals</text>

  <!-- Monitoring -->
  <rect x="760" y="526" width="220" height="22" rx="6" fill="#0a1e20" stroke="#2a7080" stroke-width="1"/>
  <text x="870" y="541" text-anchor="middle" fill="#40a0b0" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">Cloud Monitoring · Alerts · Drift Detection</text>

  <!-- Cost badge -->
  <rect x="60" y="526" width="30" height="22" rx="4" fill="#0f1a10" stroke="#2a6040" stroke-width="1"/>
  <text x="75" y="541" text-anchor="middle" fill="#4ab870" font-size="8" font-family="'Courier New', monospace">$1.58</text>

