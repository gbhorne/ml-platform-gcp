  <text x="890" y="98" text-anchor="middle" fill="#40a0b0" font-size="9" letter-spacing="1" font-family="'Courier New', monospace">ORCHESTRATION</text>
  <text x="890" y="116" text-anchor="middle" fill="#e8edf8" font-size="12" font-weight="bold" font-family="Georgia, serif">Pub/Sub + Scheduler</text>
  <text x="890" y="132" text-anchor="middle" fill="#2a7080" font-size="9" font-family="'Courier New', monospace">3 topics · 5 subscriptions</text>

